name: biomedai
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - imbalanced-learn
  - matplotlib
  - seaborn
  - openpyxl
  - tqdm
  - xgboost
  - catboost>=1.2.8  # более ранние сборки несовместимы с numpy 2
  - lifelines
  - shap>=0.49  # SHAP 0.48 не читает base_score моделей XGBoost 3.x
  - optuna
  - kmodes
  - kneed
  - tensorflow
  - ipykernel
